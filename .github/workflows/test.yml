name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  run_all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build the tool
        run: python scripts/build_tool.py

      - name: Run test suite (--quick: skips the Playwright PDF check)
        run: python tests/run_all.py --quick
